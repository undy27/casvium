name: casvium
description: Gestión artesanal y colaborativa de tareas domésticas con PostgreSQL en Railway.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  postgres: ^3.2.0
  intl: ^0.19.0
  http: ^1.5.0
  uuid: ^4.5.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - sql/household_snapshot.sql
    - sql/railway_compatibility.sql
